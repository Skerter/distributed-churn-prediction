apiVersion: batch/v1
kind: Job
metadata:
  name: dcp-pipeline-job
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: dcp-pipeline
        component: pipeline-job
    spec:
      restartPolicy: Never

      containers:
        - name: dcp-pipeline
          image: ghcr.io/skerter/distributed-churn-prediction:make-k8s-pipeline-v1
          imagePullPolicy: Always

          args:
            - python
            - -m
            - src.presentation.cli.main
            - run-pipeline
            - --profile
            - dask_k8s
            - --execute

          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONPATH
              value: "/app"

          volumeMounts:
            - name: dcp-storage
              mountPath: /mnt/dcp

      volumes:
        - name: dcp-storage
          persistentVolumeClaim:
            claimName: dcp-storage