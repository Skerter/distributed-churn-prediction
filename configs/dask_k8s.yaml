runtime:
  mode: "dask_k8s"

paths:
  data_source: "/mnt/dcp/data/source"
  data_processed: "/mnt/dcp/data/processed"
  models: "/mnt/dcp/models"
  logs: "/mnt/dcp/logs"
  notebooks: "/mnt/dcp/notebooks"

dask:
  scheduler_address: "tcp://dcp-cluster-service:8786"

api:
  pipeline_executor: "kubernetes_job"
  max_concurrent_pipeline_runs: 1

  kubernetes:
    namespace: "default"
    job_name_prefix: "dcp-pipeline"
    job_image: "ghcr.io/skerter/distributed-churn-prediction:v0.4.0"
    image_pull_policy: "IfNotPresent"
    storage_pvc_name: "dcp-storage"
    storage_mount_path: "/mnt/dcp"
    pipeline_profile: "dask_k8s"