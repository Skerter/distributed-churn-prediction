name: Build and publish Docker image to GHCR

on:
  push:
    branches:
      - main
      - make-k8s-pipeline-v1
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/skerter/distributed-churn-prediction

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            IMAGE_TAG="${GITHUB_REF_NAME}"
          else
            SAFE_BRANCH="${GITHUB_REF_NAME//\//-}"
            IMAGE_TAG="${SAFE_BRANCH}-${SHORT_SHA}"
          fi

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Build image
        shell: bash
        run: |
          docker build \
            -t "${IMAGE_NAME}:${{ steps.meta.outputs.image_tag }}" \
            -t "${IMAGE_NAME}:latest" \
            .

      - name: Smoke test image
        shell: bash
        run: |
          docker run --rm "${IMAGE_NAME}:${{ steps.meta.outputs.image_tag }}" \
            python -c "import dask, distributed, pandas, pyarrow, xgboost, coloredlogs, kagglehub; print('ghcr image ok')"

      - name: Push versioned image
        shell: bash
        run: |
          docker push "${IMAGE_NAME}:${{ steps.meta.outputs.image_tag }}"

      - name: Push latest image for main
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          docker push "${IMAGE_NAME}:latest"

      - name: Print image reference
        shell: bash
        run: |
          echo "Pushed image:"
          echo "${IMAGE_NAME}:${{ steps.meta.outputs.image_tag }}"