name: Build and Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/skerter/distributed-churn-prediction

jobs:
  build:
    name: Build and push Docker image
    outputs:
      image_tag: ${{ steps.tags.outputs.sha_tag }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          SHA_TAG="sha-${SHORT_SHA}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            PRIMARY_TAG="${GITHUB_REF_NAME}"
            BRANCH_TAG=""
          else
            BRANCH_TAG="${GITHUB_REF_NAME//\//-}"
            PRIMARY_TAG="${BRANCH_TAG}"
          fi

          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "primary_tag=${PRIMARY_TAG}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=${BRANCH_TAG}" >> "$GITHUB_OUTPUT"

          echo "Prepared tags:"
          echo "  primary_tag=${PRIMARY_TAG}"
          echo "  sha_tag=${SHA_TAG}"
          echo "  branch_tag=${BRANCH_TAG}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        shell: bash
        run: |
          docker build \
            -f docker/Dockerfile \
            -t "${IMAGE_NAME}:${{ steps.tags.outputs.primary_tag }}" \
            -t "${IMAGE_NAME}:${{ steps.tags.outputs.sha_tag }}" \
            .

      - name: Smoke test image
        shell: bash
        run: |
          docker run --rm "${IMAGE_NAME}:${{ steps.tags.outputs.sha_tag }}" \
            python -c "import dask, distributed, pandas, pyarrow, xgboost, coloredlogs, kagglehub; print('ghcr image ok')"

      - name: Push primary tag
        shell: bash
        run: |
          docker push "${IMAGE_NAME}:${{ steps.tags.outputs.primary_tag }}"

      - name: Push commit SHA tag
        shell: bash
        run: |
          docker push "${IMAGE_NAME}:${{ steps.tags.outputs.sha_tag }}"

      - name: Push latest for main
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          docker tag "${IMAGE_NAME}:${{ steps.tags.outputs.sha_tag }}" "${IMAGE_NAME}:latest"
          docker push "${IMAGE_NAME}:latest"

      - name: Print image references
        shell: bash
        run: |
          echo "Pushed images:"
          echo "  ${IMAGE_NAME}:${{ steps.tags.outputs.primary_tag }}"
          echo "  ${IMAGE_NAME}:${{ steps.tags.outputs.sha_tag }}"

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "  ${IMAGE_NAME}:latest"
          fi

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -eu
            cd /opt/projects/distributed-churn-prediction
            test -f deploy/selectel/.env
            git pull --ff-only origin ${{ github.ref_name }}
            export IMAGE_TAG=${{ needs.build.outputs.image_tag }}
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
            docker network inspect proxy > /dev/null
            docker compose -f deploy/selectel/compose.yaml config --quiet
            docker compose -f deploy/selectel/compose.yaml pull backend db
            docker compose -f deploy/selectel/compose.yaml run --rm --no-deps --user 0 --entrypoint sh backend -c '
              set -eu
              owner="$(id -u mambauser):$(id -g mambauser)"
              for directory in /app/data /app/models /app/logs /mlflow-artifacts; do
                chown "$owner" "$directory"
              done'
            docker compose -f deploy/selectel/compose.yaml up -d --build --wait --wait-timeout 180
            docker compose -f deploy/selectel/compose.yaml ps
