# ════════════════════════════════════════════════════════════════════════════
# DCP Live Demo on Selectel VDS behind a shared Traefik.
#
# On the server:
#   cd deploy/selectel && cp .env.example .env
#   docker compose up -d --build  # mlflow and frontend are built locally
#
# Traefik routes requests based on docker labels to the `proxy` network.
# ════════════════════════════════════════════════════════════════════════════
services:
  # ── Web API (FastAPI) ──────────────────────────────────────────────────────
  # The same image as the bot. Runs the pipeline in-process. The browser accesses it
  # directly → requires a public https host (${API_DOMAIN}).
  backend:
    image: ghcr.io/skerter/distributed-churn-prediction:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: python -m uvicorn src.presentation.web.app:app --host 0.0.0.0 --port "${PORT:-8000}"
    # command: bash /app/start-web.sh
    env_file:
      - .env
    environment:
      PORT: "8000"
      DCP_PROFILE: "${DCP_PROFILE:-pandas}"
      ALLOWED_ORIGINS: "https://${SITE_DOMAIN}"
      # The MLflow client reads this env itself 
      # there is no set_tracking_uri call in the code
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
    volumes:
      - dcp_models:/app/models
      - dcp_data:/app/data
      - dcp_logs:/app/logs
      - mlflow_artifacts:/mlflow-artifacts
    networks:
      - proxy
      - dcp_internal
    depends_on:
      - mlflow
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.dcp-api.rule=Host(`${API_DOMAIN}`)"
      - "traefik.http.routers.dcp-api.entrypoints=websecure"
      - "traefik.http.routers.dcp-api.tls.certresolver=le"
      - "traefik.http.services.dcp-api.loadbalancer.server.port=8000"

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "80"
      BACKEND_URL: "https://${API_DOMAIN}"
      MLFLOW_URL: "https://${MLFLOW_DOMAIN}"
    networks:
      - proxy
    depends_on:
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.dcp-front.rule=Host(`${SITE_DOMAIN}`)"
      - "traefik.http.routers.dcp-front.entrypoints=websecure"
      - "traefik.http.routers.dcp-front.tls.certresolver=le"
      - "traefik.http.services.dcp-front.loadbalancer.server.port=80"

  # ── Telegram-bot ───────────────────────────────────────────────────────────
  # The same image as backend. Uses long-polling, not exposed externally.
  #
  # ⚠️ Disabled by default via profiles.
  # On Russian VDS api.telegram.org is not accessible directly: 
  # the bot starts → HTTP Client Request timeout on polling 
  # → exits → restart loop. The demo is served via the dashboard + Web API
  # the bot isn't needed.
  # To start (when a foreign proxy for Telegram is available):
  #   docker compose --profile bot up -d bot
  bot:
    image: ghcr.io/skerter/distributed-churn-prediction:${IMAGE_TAG:-latest}
    profiles: ["bot"]
    restart: unless-stopped
    command: python -m src.presentation.bot.main --profile ${DCP_PROFILE:-pandas}
    env_file:
      - .env
    environment:
      DCP_PROFILE: "${DCP_PROFILE:-pandas}"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
    volumes:
      - dcp_models:/app/models
      - dcp_data:/app/data
      # Separate logs volume: backend and bot both run _recover_stale_runs()
      # at startup — if the runs store (logs/pipeline_runs) were shared, restarting
      # the bot would mark a run started via backend as FAILED.
      - dcp_bot_logs:/app/logs
      - mlflow_artifacts:/mlflow-artifacts
    networks:
      - dcp_internal
    depends_on:
      - mlflow

  # ── MLflow UI (in Postgres) ────────────────────────────────────────────
  # build from mlflow/Dockerfile. artifact-root is shared volume with backend/bot,
  # otherwise the UI won't see artifacts logged by the client.
  mlflow:
    build:
      context: ../..
      dockerfile: mlflow/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
    volumes:
      - mlflow_artifacts:/mlflow-artifacts
    networks:
      - proxy
      - dcp_internal
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.dcp-mlflow.rule=Host(`${MLFLOW_DOMAIN}`)"
      - "traefik.http.routers.dcp-mlflow.entrypoints=websecure"
      - "traefik.http.routers.dcp-mlflow.tls.certresolver=le"
      - "traefik.http.services.dcp-mlflow.loadbalancer.server.port=5000"

  # ── Postgres (backend-store for MLflow) ────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dcp_internal

volumes:
  postgres_data:
  mlflow_artifacts:
  dcp_models:
  dcp_data:
  dcp_logs:       # store runs backend (Web API)
  dcp_bot_logs:   # separate store runs bot — does not intersect with backend

networks:
  proxy:
    external: true
  dcp_internal:
