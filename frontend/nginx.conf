server {
    listen ${PORT};

    root /usr/share/nginx/html;
    index index.html;

    # Статика маленькая: заставляем браузер перепроверять ассеты после деплоя,
    # чтобы новый HTML никогда не работал со старым CSS/JS из кеша.
    add_header Cache-Control "no-cache" always;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
